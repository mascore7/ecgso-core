name: ECGSO CORE CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required open-source files
        run: |
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md; do
            test -f "$f" || echo "Missing: $f"
          done
